{{ define "main" }}
<div class="content">
  <h1>{{ .Title }}</h1>
  <div class="prose">{{ .Content }}</div>

  {{ if .Pages }}
  <ul class="item-list">
    {{ range .Pages }}
    <li class="item">
      <a href="{{ .RelPermalink }}">{{ .Title }}</a>
      {{ with .Description }}<div class="item__meta">{{ . }}</div>{{ end }}
    </li>
    {{ end }}
  </ul>
  {{ end }}
</div>
{{ end }}
