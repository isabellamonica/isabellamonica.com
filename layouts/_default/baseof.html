<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode | default "en-us" }}">
  <head>
    {{ partial "head.html" . }}
  </head>
  <body>
    {{/* Skip link for keyboard users - hidden until focused */}}
    <a href="#main-content" class="skip-link">Skip to main content</a>

    {{ partial "header.html" . }}

    <main id="main-content" tabindex="-1">
      {{ block "main" . }}{{ end }}
    </main>

    {{ partial "footer.html" . }}

    {{ partial "foot.html" . }}
  </body>
</html>
